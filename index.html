<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #0b1120;
    border-right: 1px solid #263244;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
}

.new-chat {
    margin: 10px 15px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: #1d4ed8;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.chat-item {
    padding: 12px;
    margin-bottom: 6px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.chat-item:hover {
    background: #1e293b;
}

.chat-item.active {
    background: #263449;
}

.chat-title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.delete-chat {
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
}

.delete-chat:hover {
    color: #ef4444;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    padding: 16px 20px;
    border-bottom: 1px solid #263244;
    font-size: 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 800px;
    margin: 12px auto;
    padding: 14px 18px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    margin-right: 0;
}

.assistant {
    background: #1e293b;
    margin-left: 0;
}

.input-area {
    padding: 15px;
    border-top: 1px solid #263244;
    display: flex;
    gap: 10px;
}

.input-area textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    border-radius: 10px;
    padding: 14px;
    background: #1e293b;
    color: white;
    font-size: 16px;
    min-height: 50px;
}

.send {
    width: 80px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.send:hover {
    background: #1d4ed8;
}

/* MOBILE */

@media(max-width:700px) {

    .sidebar {
        width: 220px;
    }

    .messages {
        padding: 12px;
    }

    .message {
        max-width: 100%;
    }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-header">
        🤖 My AI
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <div id="chatList" class="chat-list"></div>

</div>


<!-- MAIN -->

<div class="main">

    <div class="topbar">
        AI Chat
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">

        <textarea
            id="messageInput"
            placeholder="Message AI..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

let currentChat = null;


/* LOAD SAVED CHATS */

async function loadChats() {

    const response = await fetch("/api/chats");

    const chats = await response.json();

    const list = document.getElementById("chatList");

    list.innerHTML = "";

    chats.forEach(chat => {

        const item = document.createElement("div");

        item.className = "chat-item";

        if (chat.id === currentChat) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <div class="chat-title">
                💬 ${escapeHtml(chat.title)}
            </div>

            <button
                class="delete-chat"
                onclick="deleteChat(event, ${chat.id})">
                🗑️
            </button>
        `;

        item.onclick = () => openChat(chat.id);

        list.appendChild(item);

    });

}


/* NEW CHAT */

async function newChat() {

    const response = await fetch("/api/chats", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            title: "New Chat"
        })

    });

    const chat = await response.json();

    currentChat = chat.id;

    document.getElementById("messages").innerHTML = "";

    await loadChats();

}


/* OPEN CHAT */

async function openChat(id) {

    currentChat = id;

    const response =
        await fetch(`/api/chats/${id}`);

    const messages = await response.json();

    const box =
        document.getElementById("messages");

    box.innerHTML = "";

    messages.forEach(message => {

        addMessage(
            message.role,
            message.content
        );

    });

    await loadChats();

}


/* SEND MESSAGE */

async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (!message) return;

    if (!currentChat) {

        await newChat();

    }

    addMessage("user", message);

    input.value = "";

    const thinking =
        addMessage("assistant", "Thinking...");

    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    chat_id: currentChat,

                    message: message

                })

            });

        const data = await response.json();

        thinking.remove();

        if (data.error) {

            addMessage(
                "assistant",
                "Error: " + data.error
            );

        } else {

            addMessage(
                "assistant",
                data.answer
            );

        }

        await loadChats();

    }

    catch(error) {

        thinking.remove();

        addMessage(
            "assistant",
            "Connection error."
        );

    }

}


/* ADD MESSAGE */

function addMessage(role, text) {

    const box =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " + role;

    div.textContent = text;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;

    return div;

}


/* DELETE CHAT */

async function deleteChat(event, id) {

    event.stopPropagation();

    await fetch(
        `/api/chats/${id}`,
        {
            method: "DELETE"
        }
    );

    if (currentChat === id) {

        currentChat = null;

        document.getElementById(
            "messages"
        ).innerHTML = "";

    }

    await loadChats();

}


/* ENTER KEY */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* SECURITY */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* START */

async function start() {

    await loadChats();

}

start();

</script>

</body>
</html>
