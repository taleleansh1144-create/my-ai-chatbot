<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🤖 HM AI</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #101b3d 0%,
                    #050814 45%,
                    #02030a 100%
                );

            color: white;

        }


        /* ---------------- HEADER ---------------- */

        .header {

            height: 115px;

            display: flex;

            align-items: center;

            padding: 15px 35px;

            border-bottom:
                1px solid rgba(70, 130, 255, 0.5);

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 180, 255, 0.08),
                    rgba(150, 50, 255, 0.10)
                );

        }


        .logo {

            width: 85px;
            height: 85px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            box-shadow:
                0 0 20px rgba(0, 200, 255, 0.5),
                0 0 35px rgba(150, 50, 255, 0.3);

        }


        .brand {

            margin-left: 22px;

        }


        .brand-name {

            font-size: 40px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #00d9ff,
                    #4169ff,
                    #bd4dff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .brand-title {

            margin-top: 4px;

            font-size: 14px;

            letter-spacing: 5px;

        }


        .brand-subtitle {

            margin-top: 8px;

            color: #aeb7ce;

            font-size: 12px;

            letter-spacing: 2px;

        }


        /* ---------------- CHAT ---------------- */

        .chat {

            height:
                calc(100vh - 205px);

            overflow-y: auto;

            padding: 35px 7%;

        }


        .message-row {

            display: flex;

            margin-bottom: 25px;

        }


        .message-row.user {

            justify-content: flex-end;

        }


        .avatar {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            object-fit: cover;

            margin-right: 12px;

            box-shadow:
                0 0 15px rgba(0, 180, 255, 0.4);

        }


        .message-content {

            max-width: 75%;

        }


        .message {

            padding: 16px 20px;

            border-radius: 17px;

            font-size: 16px;

            line-height: 1.6;

            white-space: pre-wrap;

            border:
                1px solid rgba(100, 130, 180, 0.35);

        }


        .ai-message {

            background:
                linear-gradient(
                    135deg,
                    #162136,
                    #0c1425
                );

        }


        .user-message {

            background:
                linear-gradient(
                    135deg,
                    #4b3db5,
                    #7739bd
                );

        }


        .time {

            color: #7f8aa3;

            font-size: 11px;

            margin-top: 5px;

            margin-left: 10px;

        }


        /* ---------------- INPUT ---------------- */

        .bottom {

            height: 90px;

            padding:
                10px 5% 15px;

        }


        .input-container {

            max-width: 1000px;

            margin: auto;

            height: 58px;

            display: flex;

            align-items: center;

            padding-left: 18px;

            border-radius: 18px;

            border:
                1px solid rgba(60, 130, 255, 0.7);

            background: #0d162b;

            box-shadow:
                0 0 25px rgba(0, 120, 255, 0.15);

        }


        #message {

            flex: 1;

            background: transparent;

            border: none;

            outline: none;

            color: white;

            font-size: 16px;

        }


        #message::placeholder {

            color: #7d879d;

        }


        .send {

            width: 52px;
            height: 48px;

            margin-right: 5px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 22px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #3658ff,
                    #8b38ff
                );

            box-shadow:
                0 0 15px rgba(100, 70, 255, 0.4);

        }


        .send:hover {

            transform: scale(1.05);

        }


        .footer {

            text-align: center;

            color: #69738a;

            font-size: 10px;

            margin-top: 7px;

        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 700px) {

            .header {

                height: 90px;

                padding: 10px 15px;

            }


            .logo {

                width: 65px;
                height: 65px;

            }


            .brand {

                margin-left: 12px;

            }


            .brand-name {

                font-size: 28px;

            }


            .brand-title {

                font-size: 9px;

                letter-spacing: 3px;

            }


            .brand-subtitle {

                display: none;

            }


            .chat {

                height:
                    calc(100vh - 180px);

                padding:
                    20px 12px;

            }


            .message-content {

                max-width: 85%;

            }


            .message {

                font-size: 15px;

            }


            .bottom {

                height: 90px;

                padding: 8px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <img
        class="logo"
        src="{{ url_for('static', filename='hm-ai-logo.png') }}"
        alt="HM AI Logo"
    >


    <div class="brand">

        <div class="brand-name">
            HM AI
        </div>

        <div class="brand-title">
            HUMAN MADE AI
        </div>

        <div class="brand-subtitle">
            MADE BY HUMAN, DESIGNED FOR FUTURE
        </div>

    </div>

</div>



<!-- CHAT -->

<div class="chat" id="chat">


    <!-- FIRST AI MESSAGE -->

    <div class="message-row">

        <img
            class="avatar"
            src="{{ url_for('static', filename='hm-ai-logo.png') }}"
            alt="HM AI"
        >


        <div class="message-content">

            <div class="message ai-message">

Hello! 👋

I'm HM AI. How can I help you today?

            </div>

            <div class="time">
                HM AI
            </div>

        </div>

    </div>


</div>



<!-- INPUT -->

<div class="bottom">

    <div class="input-container">

        <input
            id="message"
            type="text"
            placeholder="Message HM AI..."
            autocomplete="off"
        >


        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


    <div class="footer">
        © 2026 HM AI. All rights reserved.
    </div>

</div>



<script>


const input =
    document.getElementById("message");


const chat =
    document.getElementById("chat");



/* ENTER KEY */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);



/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



/* TIME */

function getTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* SEND MESSAGE */

async function sendMessage() {


    const message =
        input.value.trim();


    if (!message) {

        return;

    }



    /* USER MESSAGE */

    const userRow =
        document.createElement("div");

    userRow.className =
        "message-row user";


    userRow.innerHTML = `

        <div class="message-content">

            <div class="message user-message">

                ${escapeHTML(message)}

            </div>

            <div class="time">

                ${getTime()}

            </div>

        </div>

    `;


    chat.appendChild(userRow);


    input.value = "";


    chat.scrollTop =
        chat.scrollHeight;



    /* AI THINKING */

    const aiRow =
        document.createElement("div");

    aiRow.className =
        "message-row";


    aiRow.innerHTML = `

        <img
            class="avatar"
            src="{{ url_for('static', filename='hm-ai-logo.png') }}"
            alt="HM AI"
        >

        <div class="message-content">

            <div class="message ai-message">

                Thinking... 🤖

            </div>

        </div>

    `;


    chat.appendChild(aiRow);


    chat.scrollTop =
        chat.scrollHeight;



    /* ASK GEMINI */

    try {


        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        const data =
            await response.json();


        aiRow
            .querySelector(".ai-message")
            .textContent =
            data.reply;


        const time =
            document.createElement("div");


        time.className =
            "time";


        time.textContent =
            getTime();


        aiRow
            .querySelector(".message-content")
            .appendChild(time);


    }

    catch (error) {


        aiRow
            .querySelector(".ai-message")
            .textContent =
            "❌ Could not connect to HM AI.";

    }


    chat.scrollTop =
        chat.scrollHeight;

}

</script>


</body>

</html>
